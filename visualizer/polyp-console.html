<!--
  Polyp patch-layout console. Concept-stage: arrange PCA9685 "patches" into a
  shared grid, then run an effect across the stitched space. Camera controls
  and dial widget are the same hand-rolled implementation as the Tuft console,
  kept consistent on purpose.
-->
<title>Polyp</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
  :root{
    --bg:#080c0a;
    --panel: rgba(15,21,17,0.74);
    --ink:#eaf2ea;
    --ink-dim:#8fa596;
    --ink-faint:#526158;
    --accent:#3ddc97;
    --accent-soft: rgba(61,220,151,0.16);
    --accent-2:#e08a4a;
    --accent-2-soft: rgba(224,138,74,0.16);
    --line: rgba(234,242,234,0.09);
    --warn:#ff6b5e;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:'IBM Plex Sans', system-ui, sans-serif;}
  #scene{position:fixed;inset:0;}
  canvas{display:block;touch-action:none;}

  .topbar{position:fixed;top:22px;left:26px;pointer-events:none;}
  .wordmark{font-family:'Fraunces', Georgia, serif;font-weight:600;font-size:1.9rem;
    letter-spacing:-0.01em;color:var(--ink);font-style:italic;}
  .subtitle{font-family:'JetBrains Mono',monospace;font-size:0.68rem;letter-spacing:0.14em;
    text-transform:uppercase;color:var(--ink-faint);margin-top:2px;}

  .hint{position:fixed;bottom:20px;left:26px;font-family:'JetBrains Mono',monospace;
    font-size:0.66rem;color:var(--ink-faint);letter-spacing:0.02em;line-height:1.6;
    pointer-events:none;}
  .hint b{color:var(--ink-dim);font-weight:500;}

  .reset-btn{position:fixed;bottom:20px;right:26px;font-family:'JetBrains Mono',monospace;
    font-size:0.68rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-dim);
    background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:8px 14px;cursor:pointer;backdrop-filter:blur(10px);}
  .reset-btn:hover{color:var(--ink);border-color:var(--accent-soft);}
  .reset-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .dock{position:fixed;top:26px;right:26px;width:272px;max-height:calc(100% - 52px);
    overflow-y:auto;background:var(--panel);backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:16px;padding:18px 18px 20px;
    display:flex;flex-direction:column;gap:16px;}
  .dock::-webkit-scrollbar{width:6px;}
  .dock::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}

  .section-label{font-family:'JetBrains Mono',monospace;font-size:0.62rem;
    letter-spacing:0.16em;text-transform:uppercase;color:var(--ink-faint);
    margin-bottom:10px;}
  .section{border-top:1px solid var(--line);padding-top:14px;}
  .section:first-child{border-top:none;padding-top:0;}

  .status-grid{display:grid;grid-template-columns:1fr auto;row-gap:7px;column-gap:10px;
    font-family:'JetBrains Mono',monospace;font-size:0.72rem;}
  .status-grid dt{color:var(--ink-faint);}
  .status-grid dd{margin:0;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums;}

  .segmented{display:flex;background:rgba(0,0,0,0.25);border-radius:9px;padding:3px;
    border:1px solid var(--line);}
  .segmented button{flex:1;background:none;border:none;color:var(--ink-faint);
    font-family:'IBM Plex Sans';font-size:0.7rem;font-weight:500;padding:8px 4px;
    border-radius:6px;cursor:pointer;transition:background .2s,color .2s;}
  .segmented button.active{background:var(--accent-soft);color:var(--accent);}
  .segmented button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}
  .segmented.warn button.active{background:var(--accent-2-soft);color:var(--accent-2);}

  .dial-row{display:flex;gap:14px;justify-content:space-between;}
  .dial-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;
    -webkit-user-select:none;user-select:none;}
  .dial-wrap svg{cursor:grab;touch-action:none;}
  .dial-wrap svg:active{cursor:grabbing;}
  .dial-label{font-size:0.62rem;letter-spacing:0.06em;text-transform:uppercase;
    color:var(--ink-faint);text-align:center;}
  .dial-value{font-family:'JetBrains Mono',monospace;font-size:0.78rem;color:var(--ink);
    font-variant-numeric:tabular-nums;}

  .slider-block{margin-bottom:14px;}
  .slider-block:last-child{margin-bottom:0;}
  .slider-head{display:flex;justify-content:space-between;font-size:0.72rem;
    color:var(--ink-dim);margin-bottom:6px;}
  .slider-head span:last-child{font-family:'JetBrains Mono',monospace;color:var(--ink);
    font-variant-numeric:tabular-nums;}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;
    background:var(--line);border-radius:2px;outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;
    border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 0 0 3px var(--accent-soft);}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border:none;border-radius:50%;
    background:var(--accent);cursor:pointer;box-shadow:0 0 0 3px var(--accent-soft);}

  .note{font-size:0.68rem;color:var(--ink-faint);line-height:1.5;margin-top:2px;}

  @media (max-width: 640px){
    .dock{width:calc(100% - 32px);left:16px;right:16px;top:auto;bottom:16px;max-height:44vh;}
    .topbar{top:16px;left:16px;}
    .hint{display:none;}
  }
</style>

<div id="scene"></div>

<div class="topbar">
  <div class="wordmark">Polyp</div>
  <div class="subtitle">servo patches · not-wled console</div>
</div>

<div class="hint" id="hint">
  <b>drag a patch</b> to re-arrange · <b>right-drag</b> pan · <b>scroll</b> zoom
</div>

<button class="reset-btn" id="resetView">reset view</button>

<div class="dock">
  <div class="section">
    <div class="segmented" id="modeToggle">
      <button id="modeArrange" class="active">arrange</button>
      <button id="modeRun">run</button>
    </div>
  </div>

  <div class="section">
    <div class="section-label">Rig</div>
    <dl class="status-grid">
      <dt>boards (patches)</dt><dd id="statBoards">–</dd>
      <dt>channels / board</dt><dd id="statChPerBoard">–</dd>
      <dt>channels total</dt><dd id="statChTotal">–</dd>
      <dt>i2c range</dt><dd id="statAddr">–</dd>
    </dl>
  </div>

  <div class="section">
    <div class="section-label">Layout</div>
    <div class="dial-row">
      <div class="dial-wrap" id="dialPatches"></div>
      <div class="dial-wrap" id="dialCells"></div>
    </div>
    <div class="slider-block" style="margin-top:14px;">
      <div class="slider-head"><span>board gap</span><span id="valGap">0.35</span></div>
      <input type="range" id="sliderGap" min="0" max="120" value="35" step="5">
    </div>
  </div>

  <div class="section">
    <div class="section-label">Effect</div>
    <div class="segmented" id="effectToggle">
      <button data-fx="ripple" class="active">ripple</button>
      <button data-fx="sweep">sweep</button>
      <button data-fx="chase">chase</button>
    </div>
    <div class="slider-block" style="margin-top:14px;">
      <div class="slider-head"><span>speed</span><span id="valSpeed">1.0x</span></div>
      <input type="range" id="sliderSpeed" min="10" max="300" value="100" step="5">
    </div>
    <div class="slider-block">
      <div class="slider-head"><span>wavelength</span><span id="valScale">0.9</span></div>
      <input type="range" id="sliderScale" min="20" max="200" value="90" step="5">
    </div>
    <div class="note" id="fxNote">click the wall to move the ripple origin</div>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ---------- scene ----------
  var container = document.getElementById('scene');
  var scene = new THREE.Scene();
  var bgColor = 0x080c0a;
  scene.background = new THREE.Color(bgColor);
  scene.fog = new THREE.Fog(bgColor, 10, 30);

  var camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 100);
  var renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  container.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0x3a4a3f, 0x040604, 0.5));
  var key = new THREE.DirectionalLight(0xbfe8d4, 1.0);
  key.position.set(4, 3, 6);
  scene.add(key);
  var rim = new THREE.DirectionalLight(0xe08a4a, 0.35);
  rim.position.set(-5, -2, -3);
  scene.add(rim);

  var backWall = new THREE.Mesh(
    new THREE.PlaneGeometry(60, 40),
    new THREE.MeshStandardMaterial({color:0x0a0f0c, roughness:1})
  );
  backWall.position.z = -0.3;
  scene.add(backWall);

  // ---------- camera controls (orbit / pan / zoom, same as tuft console) ----------
  var target = new THREE.Vector3(0, 0, 0);
  var spherical = {radius: 8.5, theta: 0.35, phi: Math.PI*0.44};
  var DEFAULT_SPH = {radius:8.5, theta:0.35, phi:Math.PI*0.44};
  var DEFAULT_TARGET = target.clone();

  function applyCamera(){
    var s = Math.max(0.001, Math.sin(spherical.phi));
    camera.position.x = target.x + spherical.radius * s * Math.sin(spherical.theta);
    camera.position.y = target.y + spherical.radius * Math.cos(spherical.phi);
    camera.position.z = target.z + spherical.radius * s * Math.cos(spherical.theta);
    camera.lookAt(target);
  }
  applyCamera();

  var dragMode = null, lastX=0, lastY=0, draggingPatch = null;
  var raycaster = new THREE.Raycaster();
  var mouse = new THREE.Vector2();
  var dragPlane = new THREE.Plane(new THREE.Vector3(0,0,1), 0);
  var dragPoint = new THREE.Vector3();

  renderer.domElement.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  renderer.domElement.addEventListener('pointerdown', function(e){
    lastX = e.clientX; lastY = e.clientY;
    renderer.domElement.setPointerCapture(e.pointerId);

    if(state.mode === 'arrange' && e.button === 0 && !e.shiftKey){
      mouse.x = (e.clientX/innerWidth)*2-1; mouse.y = -(e.clientY/innerHeight)*2+1;
      raycaster.setFromCamera(mouse, camera);
      var hit = raycaster.intersectObjects(patches.map(function(p){return p.hitMesh;}))[0];
      if(hit){
        draggingPatch = hit.object.userData.patch;
        return;
      }
    }
    dragMode = (e.button === 2 || e.shiftKey) ? 'pan' : 'orbit';
  });

  renderer.domElement.addEventListener('pointermove', function(e){
    if(draggingPatch){
      mouse.x = (e.clientX/innerWidth)*2-1; mouse.y = -(e.clientY/innerHeight)*2+1;
      raycaster.setFromCamera(mouse, camera);
      raycaster.ray.intersectPlane(dragPlane, dragPoint);
      var stepX = layout().stepX, stepY = layout().stepY;
      var gx = Math.round(dragPoint.x/stepX), gy = Math.round(dragPoint.y/stepY);
      if(!isOccupied(gx, gy, draggingPatch)){ draggingPatch.gx = gx; draggingPatch.gy = gy; }
      return;
    }
    if(!dragMode) return;
    var dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    if(dragMode === 'orbit'){
      spherical.theta -= dx * 0.006;
      spherical.phi = Math.min(Math.PI*0.49, Math.max(0.08, spherical.phi - dy * 0.006));
    } else {
      var panSpeed = spherical.radius * 0.0012;
      var right = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 0);
      var up = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 1);
      target.addScaledVector(right, -dx*panSpeed);
      target.addScaledVector(up, dy*panSpeed);
    }
    applyCamera();
  });

  ['pointerup','pointercancel','pointerleave'].forEach(function(ev){
    renderer.domElement.addEventListener(ev, function(){ dragMode = null; draggingPatch = null; });
  });

  renderer.domElement.addEventListener('wheel', function(e){
    e.preventDefault();
    spherical.radius = Math.min(20, Math.max(3, spherical.radius * (1 + e.deltaY*0.001)));
    applyCamera();
  }, {passive:false});

  document.getElementById('resetView').addEventListener('click', function(){
    spherical.radius = DEFAULT_SPH.radius; spherical.theta = DEFAULT_SPH.theta; spherical.phi = DEFAULT_SPH.phi;
    target.copy(DEFAULT_TARGET);
    applyCamera();
  });

  window.addEventListener('resize', function(){
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  // click on the wall (run mode) sets the ripple origin
  var downPos = null;
  renderer.domElement.addEventListener('pointerdown', function(e){ downPos = {x:e.clientX, y:e.clientY}; });
  renderer.domElement.addEventListener('pointerup', function(e){
    if(!downPos) return;
    var moved = Math.hypot(e.clientX-downPos.x, e.clientY-downPos.y);
    downPos = null;
    if(moved > 6 || state.mode !== 'run') return;
    mouse.x = (e.clientX/innerWidth)*2-1; mouse.y = -(e.clientY/innerHeight)*2+1;
    raycaster.setFromCamera(mouse, camera);
    var pt = new THREE.Vector3();
    raycaster.ray.intersectPlane(dragPlane, pt);
    if(pt){ state.rippleOrigin.set(pt.x, pt.y); }
  });

  // ---------- patches / paddles ----------
  var CELL_PRESETS = [
    {cols:2, rows:2}, {cols:4, rows:2}, {cols:3, rows:3},
    {cols:4, rows:3}, {cols:4, rows:4}
  ];
  var CELL_SIZE = 0.42;
  var addrLabelCache = {};

  function makeAddrSprite(text){
    if(addrLabelCache[text]) return addrLabelCache[text].clone();
    var c = document.createElement('canvas'); c.width=256; c.height=96;
    var ctx = c.getContext('2d');
    ctx.font = '600 44px "JetBrains Mono", monospace';
    ctx.fillStyle = '#3ddc97';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, 128, 52);
    var tex = new THREE.CanvasTexture(c);
    var mat = new THREE.SpriteMaterial({map:tex, transparent:true, depthWrite:false});
    var sprite = new THREE.Sprite(mat);
    sprite.scale.set(0.8, 0.3, 1);
    addrLabelCache[text] = sprite;
    return sprite.clone();
  }

  var paddleGeo = new THREE.BoxGeometry(0.16, 0.16, 0.02);
  var paddleMat = new THREE.MeshStandardMaterial({color:0x2b332e, roughness:0.35, metalness:0.55, emissive:0x0a1210});
  var frameMat = new THREE.MeshStandardMaterial({color:0x101712, roughness:0.9});

  var patches = [];

  function layout(){
    var preset = CELL_PRESETS[state.cellsIdx];
    var gap = state.gap;
    var pw = preset.cols*CELL_SIZE, ph = preset.rows*CELL_SIZE;
    return {cols:preset.cols, rows:preset.rows, pw:pw, ph:ph, stepX: pw+gap, stepY: ph+gap};
  }

  function isOccupied(gx, gy, exclude){
    for(var i=0;i<patches.length;i++){
      var p = patches[i];
      if(p!==exclude && p.gx===gx && p.gy===gy) return true;
    }
    return false;
  }

  function buildPatch(index, gx, gy){
    var L = layout();
    var group = new THREE.Group();
    group.userData.patch = null;
    scene.add(group);

    var frame = new THREE.Mesh(new THREE.PlaneGeometry(L.pw+0.06, L.ph+0.06), frameMat);
    group.add(frame);

    var paddles = [];
    for(var r=0;r<L.rows;r++){
      for(var c=0;c<L.cols;c++){
        var pv = new THREE.Group();
        var lx = (-(L.cols-1)/2 + c) * CELL_SIZE;
        var ly = (-(L.rows-1)/2 + r) * CELL_SIZE;
        pv.position.set(lx, ly, 0.03);
        var mesh = new THREE.Mesh(paddleGeo, paddleMat.clone());
        pv.add(mesh);
        group.add(pv);
        paddles.push({pivot:pv, mesh:mesh, lx:lx, ly:ly});
      }
    }

    var addr = makeAddrSprite('0x' + (0x40+index).toString(16));
    addr.position.set(0, L.ph/2 + 0.28, 0.05);
    group.add(addr);

    var hitMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(L.pw+0.06, L.ph+0.06),
      new THREE.MeshBasicMaterial({visible:false})
    );
    hitMesh.position.z = 0.04;
    group.add(hitMesh);

    var patch = {index:index, gx:gx, gy:gy, group:group, paddles:paddles, hitMesh:hitMesh};
    hitMesh.userData.patch = patch;
    return patch;
  }

  function rebuildPatches(count){
    for(var i=0;i<patches.length;i++) scene.remove(patches[i].group);
    patches = [];
    var cols = Math.ceil(Math.sqrt(count));
    for(var i2=0;i2<count;i2++){
      var gx = (i2 % cols) - (cols-1)/2;
      var gy = Math.floor(i2/cols);
      patches.push(buildPatch(i2, Math.round(gx), Math.round(gy)));
    }
    updateStats();
  }

  function updateStats(){
    var L = layout();
    var perBoard = L.cols*L.rows;
    document.getElementById('statBoards').textContent = patches.length;
    document.getElementById('statChPerBoard').textContent = perBoard + ' / 16';
    document.getElementById('statChTotal').textContent = perBoard*patches.length;
    document.getElementById('statAddr').textContent =
      '0x40–0x' + (0x40+Math.max(0,patches.length-1)).toString(16);
  }

  // ---------- state ----------
  var state = {
    mode: 'arrange',
    patchCount: 4,
    cellsIdx: 3, // 4x3
    gap: 0.35,
    fx: 'ripple',
    speed: 1.0,
    scale: 0.9,
    rippleOrigin: new THREE.Vector2(0,0)
  };
  rebuildPatches(state.patchCount);

  // ---------- dials (same widget as tuft console) ----------
  function makeDial(mount, opts){
    var size = 84, cx = size/2, cy = size/2, r = 32;
    var sweep = Math.PI * 1.5;
    var start = Math.PI*0.5 + Math.PI*0.25;

    var svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('width', size); svg.setAttribute('height', size);
    svg.setAttribute('viewBox', '0 0 '+size+' '+size);

    function arcPath(fromA, toA){
      var x1 = cx + r*Math.cos(fromA), y1 = cy + r*Math.sin(fromA);
      var x2 = cx + r*Math.cos(toA), y2 = cy + r*Math.sin(toA);
      var large = (toA-fromA) > Math.PI ? 1 : 0;
      return 'M '+x1+' '+y1+' A '+r+' '+r+' 0 '+large+' 1 '+x2+' '+y2;
    }

    var track = document.createElementNS('http://www.w3.org/2000/svg','path');
    track.setAttribute('d', arcPath(start, start+sweep));
    track.setAttribute('stroke', 'rgba(234,242,234,0.10)');
    track.setAttribute('stroke-width', 6);
    track.setAttribute('fill', 'none');
    track.setAttribute('stroke-linecap','round');
    svg.appendChild(track);

    var fill = document.createElementNS('http://www.w3.org/2000/svg','path');
    fill.setAttribute('stroke', opts.color || '#3ddc97');
    fill.setAttribute('stroke-width', 6);
    fill.setAttribute('fill', 'none');
    fill.setAttribute('stroke-linecap','round');
    svg.appendChild(fill);

    var knob = document.createElementNS('http://www.w3.org/2000/svg','circle');
    knob.setAttribute('r', 4);
    knob.setAttribute('fill', opts.color || '#3ddc97');
    svg.appendChild(knob);

    var wrap = document.createElement('div');
    wrap.className = 'dial-wrap';
    wrap.appendChild(svg);
    var label = document.createElement('div');
    label.className = 'dial-label'; label.textContent = opts.label;
    var value = document.createElement('div');
    value.className = 'dial-value';
    wrap.appendChild(value); wrap.appendChild(label);
    mount.appendChild(wrap);

    var idx = opts.startIndex !== undefined ? opts.startIndex : opts.value;
    function render(){
      var t = (idx - opts.min) / (opts.max - opts.min);
      fill.setAttribute('d', arcPath(start, start + sweep*t));
      var ang = start + sweep*t;
      knob.setAttribute('cx', cx + r*Math.cos(ang));
      knob.setAttribute('cy', cy + r*Math.sin(ang));
      value.textContent = opts.format ? opts.format(idx) : idx;
    }
    render();

    var dragging = false, startY = 0, startVal = 0;
    svg.addEventListener('pointerdown', function(e){
      dragging = true; startY = e.clientY; startVal = idx;
      svg.setPointerCapture(e.pointerId);
    });
    svg.addEventListener('pointermove', function(e){
      if(!dragging) return;
      var dy = startY - e.clientY;
      var range = opts.max - opts.min;
      var next = startVal + (dy/120) * range;
      idx = Math.min(opts.max, Math.max(opts.min, Math.round(next)));
      render();
      opts.onChange(idx);
    });
    ['pointerup','pointercancel'].forEach(function(ev){
      svg.addEventListener(ev, function(){ dragging = false; });
    });

    return {set:function(v){ idx=v; render(); }};
  }

  makeDial(document.getElementById('dialPatches'), {
    label:'patches', min:1, max:9, step:1, value:state.patchCount, color:'#3ddc97',
    format:function(v){ return v; },
    onChange:function(v){ state.patchCount = v; rebuildPatches(v); }
  });

  makeDial(document.getElementById('dialCells'), {
    label:'cells/patch', min:0, max:CELL_PRESETS.length-1, step:1, value:state.cellsIdx, color:'#e08a4a',
    format:function(v){ var p = CELL_PRESETS[v]; return p.cols+'×'+p.rows; },
    onChange:function(v){ state.cellsIdx = v; rebuildPatches(state.patchCount); }
  });

  // ---------- sliders ----------
  document.getElementById('sliderGap').addEventListener('input', function(e){
    state.gap = e.target.value/100;
    document.getElementById('valGap').textContent = state.gap.toFixed(2);
    rebuildPatches(state.patchCount);
  });
  document.getElementById('sliderSpeed').addEventListener('input', function(e){
    state.speed = e.target.value/100;
    document.getElementById('valSpeed').textContent = state.speed.toFixed(1)+'x';
  });
  document.getElementById('sliderScale').addEventListener('input', function(e){
    state.scale = e.target.value/100;
    document.getElementById('valScale').textContent = state.scale.toFixed(2);
  });

  var fxNotes = {
    ripple: 'click the wall to move the ripple origin',
    sweep: 'travels left to right across the whole rig',
    chase: 'diagonal chase across the whole rig'
  };
  document.getElementById('effectToggle').addEventListener('click', function(e){
    var btn = e.target.closest('button'); if(!btn) return;
    state.fx = btn.dataset.fx;
    document.querySelectorAll('#effectToggle button').forEach(function(b){ b.classList.toggle('active', b===btn); });
    document.getElementById('fxNote').textContent = fxNotes[state.fx];
  });

  document.getElementById('modeArrange').addEventListener('click', function(){
    state.mode='arrange';
    document.getElementById('modeArrange').classList.add('active');
    document.getElementById('modeRun').classList.remove('active');
    document.getElementById('hint').innerHTML = '<b>drag a patch</b> to re-arrange · <b>right-drag</b> pan · <b>scroll</b> zoom';
  });
  document.getElementById('modeRun').addEventListener('click', function(){
    state.mode='run';
    document.getElementById('modeRun').classList.add('active');
    document.getElementById('modeArrange').classList.remove('active');
    document.getElementById('hint').innerHTML = '<b>click the wall</b> to move the ripple · <b>right-drag</b> pan · <b>scroll</b> zoom';
  });

  // ---------- animate ----------
  var clock = new THREE.Clock();
  function effectValue(wx, wy, t){
    if(state.fx === 'ripple'){
      var d = Math.hypot(wx-state.rippleOrigin.x, wy-state.rippleOrigin.y);
      return Math.sin(d/state.scale - t*state.speed*3);
    } else if(state.fx === 'sweep'){
      return Math.sin(wx/state.scale - t*state.speed*3);
    } else {
      return Math.sin((wx+wy)/state.scale - t*state.speed*3);
    }
  }

  function animate(){
    requestAnimationFrame(animate);
    var t = clock.getElapsedTime();
    var L = layout();

    for(var i=0;i<patches.length;i++){
      var p = patches[i];
      var wcx = p.gx*L.stepX, wcy = p.gy*L.stepY;
      p.group.position.set(wcx, wcy, 0);
      for(var j=0;j<p.paddles.length;j++){
        var pd = p.paddles[j];
        var wx = wcx + pd.lx, wy = wcy + pd.ly;
        var v = effectValue(wx, wy, t);
        pd.pivot.rotation.y = v * 0.85;
        var glow = (v*0.5+0.5) * 0.5;
        pd.mesh.material.emissive.setRGB(0.04+glow*0.02, 0.07+glow*0.35, 0.06+glow*0.25);
      }
    }
    renderer.render(scene, camera);
  }
  animate();
})();
</script>
